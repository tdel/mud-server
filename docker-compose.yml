services:
  db:
    image: mariadb:12.3.2
    ports:
      - "3306:3306"
    environment:
      - MYSQL_USER=orion
      - MYSQL_PASSWORD=orion
      - MYSQL_ROOT_PASSWORD=orion
      - MYSQL_DATABASE=orion
    volumes:
      - ./docker/build/db/orion:/var/lib/mysql

  nginx:
    image: nginx:alpine
    working_dir: /var/www/orion
    volumes:
      - ./:/var/www/orion
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - php

  php:
    build: docker/php
    working_dir: /var/www/orion
    depends_on:
      - db
    volumes:
      - ./:/var/www/orion
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini