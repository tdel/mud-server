services:
  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=mud-server
      - POSTGRES_PASSWORD=mud-server
      - POSTGRES_DB=mud-server
    volumes:
      - ./docker/build/db/postgres:/var/lib/postgresql/data

  php:
    build: docker/php
    working_dir: /var/www/mud-server
    depends_on:
      - db
    volumes:
      - ./:/var/www/mud-server
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini

  telnet:
    build: docker/php
    working_dir: /var/www/mud-server
    depends_on:
      - db
    restart: unless-stopped
    command: ["bin/console", "app:telnet:serve"]
    ports:
      - "${TELNET_PORT:-4000}:${TELNET_PORT:-4000}"
    volumes:
      - ./:/var/www/mud-server