services:
  db:
    image: mariadb:12.3.2
    ports:
      - "3306:3306"
    environment:
      - MYSQL_USER=mud-server
      - MYSQL_PASSWORD=mud-server
      - MYSQL_ROOT_PASSWORD=mud-server
      - MYSQL_DATABASE=mud-server
    volumes:
      - ./docker/build/db/mud:/var/lib/mysql

  nginx:
    image: nginx:alpine
    working_dir: /var/www/mud-server
    volumes:
      - ./:/var/www/mud-server
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - php

  php:
    build: docker/php
    working_dir: /var/www/mud-server
    depends_on:
      - db
    ports:
      - "${TELNET_PORT:-4000}:${TELNET_PORT:-4000}"
    volumes:
      - ./:/var/www/mud-server
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini